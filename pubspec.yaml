name: money_tracker
description: Offline money tracker with Bikram Sambat (Nepali) calendar support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database - everything stays on the phone
  sqflite: ^2.3.0
  path: ^1.9.0

  # Nepali (Bikram Sambat) calendar
  nepali_utils: ^3.0.8
  nepali_date_picker: ^7.0.1

  # Charts
  fl_chart: ^0.69.0

  # Number formatting
  intl: ^0.20.2

  # Sound effects for taps and saves
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
